<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">KiwiDesk comparison social preview</title>
  <desc id="desc">The Japanese comparison card: the headline &quot;KiwiDesk を、ほかのウインドウマネージャーと比べる。&quot;, the compared rows, the KiwiCanopy endorsement, and a schematic comparison table with the KiwiDesk column highlighted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1512"/>
      <stop offset="1" stop-color="#12251a"/>
    </linearGradient>
    <clipPath id="panel"><rect x="72" y="398" width="1056" height="330" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <image href="logo.svg" x="72" y="58" width="60" height="60" preserveAspectRatio="xMidYMid meet"/>
  <text x="146" y="103" fill="#eaf3ee" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1">KiwiDesk</text>
  <text x="1128" y="98" text-anchor="end" fill="#aacb5d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500">KiwiCanopy より</text>

  <text fill="#eaf3ee" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5">
    <tspan x="70" y="214">KiwiDesk を、ほかの</tspan>
    <tspan x="70" y="294">ウインドウマネージャーと比べる。</tspan>
  </text>
  <text x="72" y="346" fill="#aacb5d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500">レイアウト  ·  必要な権限  ·  SIP  ·  設定方法  ·  見た目</text>

  <!-- a schematic comparison table with no names on it; bleeds off the bottom edge like the banner's desktop -->
  <rect x="72" y="406" width="1056" height="330" rx="20" fill="#000000" fill-opacity=".45"/>
  <rect x="72" y="398" width="1056" height="330" rx="20" fill="#16241c"/>
  <rect x="72.5" y="398.5" width="1055" height="329" rx="19.5" fill="none" stroke="#aacb5d" stroke-opacity=".25"/>
