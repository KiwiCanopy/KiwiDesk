name: Feature Request
description: Suggest an enhancement or new behavior
type: "Feature"
title: "💡 "
body:
  - type: markdown
    attributes:
      value: |
        Check the **Status** note at the top of the
        [README](https://github.com/KiwiCanopy/KiwiDesk) first to
        see what already ships and what's still in progress.

  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: |
        The workflow or problem behind the idea — that tells us
        more than the feature itself.
      placeholder: |
        I manage windows across many spaces and need to...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Your idea
      description: |
        How would you like KiwiDesk to behave? Rough is fine.
        A screenshot of the menu or setting you mean, or a quick
        sketch of the idea, helps us picture it — drag it in
        here if you have one.
      placeholder: |
        A new option or shortcut that...
        I tried ..., but it doesn't...
    validations:
      required: true
