name: Bug Report
description: Something is not working as expected
type: "Bug"
title: "🐛 "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please give enough detail to
        reproduce the issue.

        **Windows ending up in the wrong place, focus jumping, or
        something that only happens sometimes?** Then the log
        helps us most — a plainly broken setting or wrong label
        doesn't need one. If you can, make the problem happen
        again first. Then open KiwiDesk Settings ▸ General ▸
        Advanced, pick a time range beside **Export Log…** that
        reaches back to before it happened, press the button, and
        drag the file into *Extra context* below. Can't open
        Settings? The CLI reference shows the same export from a
        terminal:
        https://kiwidesk.app/docs/cli/#exporting-the-log

  - type: input
    id: kiwidesk_version
    attributes:
      label: KiwiDesk version or commit
      description: "Run `kiwidesk --version`."
      placeholder: "0.1.0 (abc1234)"
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      description: "Run `sw_vers` or check System Settings."
      placeholder: "macOS 15.2"
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: Steps to reproduce
      description: |
        Clear, numbered steps. Include key presses, commands,
        or conditions needed to trigger the bug.
      placeholder: |
        1. Open Terminal
        2. Run `kiwidesk set_mode bsp`
        3. (etc.)
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. actual behavior
      description: |
        What should happen? What actually happened instead?
      placeholder: |
        Expected: windows tile in binary-space-partition
        Actual: windows stack vertically
    validations:
      required: true

  - type: checkboxes
    id: other_tools
    attributes:
      label: Other window managers or AX tools running?
      description: |
        Some tools interact. Is anything else managing windows,
        tracking focus, or controlling accessibility?
      options:
        - label: Other window managers (e.g., Rectangle, yabai)
        - label: Accessibility tools (e.g., Keyboard Maestro)
        - label: None that I know of
    validations:
      required: true

  - type: textarea
    id: extra_context
    attributes:
      label: Extra context
      description: |
        A screenshot or a short screen recording of the problem
        helps a lot — crop out anything private first. If the
        note above asked for the log, drag it in here too.
      placeholder: |
        (attached: KiwiDesk-log-….txt, Last 15 minutes)
        (attached: screenshot of the misplaced window)

        Happens only with a specific app?
        Only on an external monitor?
