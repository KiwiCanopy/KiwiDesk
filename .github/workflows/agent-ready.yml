# Implements an issue the owner labels `agent-ready` and opens the
# result as a DRAFT pull request for the owner to test and review.
#
# Only the owner's labelling starts it, and for an issue someone else
# filed the model sees only the title and the owner's comments.
# Claude Code runs with a fixed command allow-list (build, test, lint,
# read-only git); its transcript never reaches this public log, only
# the cost line. A plain step commits, refusing a diff that carries
# the API key, and the key is a capped Console workspace's.
name: Agent ready

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-ready-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.label.name == 'agent-ready' &&
      github.event.sender.login == 'hajiboy95'
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app \
            || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: |
          npm install --prefix "$RUNNER_TEMP/cc" \
            @anthropic-ai/claude-code@2.1.296
          echo "$RUNNER_TEMP/cc/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Issue context
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p .agent-context
          echo ".agent-context/" >> .git/info/exclude
          gh issue view "$NUMBER" --json number,title,body,author,comments \
            > "$RUNNER_TEMP/issue.json"
          python3 - "$RUNNER_TEMP/issue.json" <<'PY'
          import json, sys
          i = json.load(open(sys.argv[1]))
          owner = "hajiboy95"
          own = i["author"]["login"] == owner
          parts = [f"# #{i['number']} {i['title']}", ""]
          if own:
              parts += [i["body"] or "", ""]
          else:
              parts += ["(Filed by someone else: their text is left out. "
                        "Implement the owner's comments below.)", ""]
          for c in i["comments"]:
              if c["author"]["login"] == owner:
                  parts += ["## Owner comment", "", c["body"], ""]
          open(".agent-context/issue.md", "w").write("\n".join(parts))
          PY

      - name: Implement
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_KEY_PUBLIC }}
          # A full `swift test` outlasts Bash's 2-minute default.
          BASH_DEFAULT_TIMEOUT_MS: "1500000"
          BASH_MAX_TIMEOUT_MS: "1800000"
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude -p --output-format json --setting-sources "" \
            --model claude-opus-5-5 \
            --max-turns 150 \
            --max-budget-usd 15 \
            --tools Read Grep Glob Edit Write Bash \
            --allowedTools Edit Write \
              "Bash(swift build:*)" "Bash(swift test:*)" \
              "Bash(scripts/lint.sh:*)" "Bash(scripts/warning-gate:*)" \
              "Bash(scripts/extract-keys:*)" "Bash(scripts/merge-keys:*)" \
              "Bash(git diff:*)" "Bash(git status:*)" "Bash(git log:*)" \
            --json-schema "$(cat .github/agent-ready/schema.json)" \
            < .github/agent-ready/prompt.md > "$RUNNER_TEMP/result.json" \
            || true
          python3 - "$RUNNER_TEMP/result.json" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              d = {}
          print(f"cost ${float(d.get('total_cost_usd') or 0):.2f}, "
                f"{d.get('num_turns', '?')} turns, {d.get('subtype', 'no result')}")
          PY

      - name: Open the draft PR
        if: always() && steps.run.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.ANTHROPIC_KEY_PUBLIC }}
          NUMBER: ${{ github.event.issue.number }}
          DISPATCH_TOKEN: ${{ secrets.PLAN_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          notify() {
            [ -n "$DISPATCH_TOKEN" ] || return 0
            jq -n --arg t "$1" '{event_type: "notify", client_payload: {text: $t}}' \
              | GH_TOKEN="$DISPATCH_TOKEN" gh api \
                  repos/KiwiCanopy/KiwiDesk-plan/dispatches --input - || true
          }
          rm -rf .agent-context
          if ! r=$(jq -e '.structured_output' "$RUNNER_TEMP/result.json" 2>/dev/null); then
            notify "agent-ready #$NUMBER: the run returned no result. $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          git add -A
          if git diff --cached --quiet; then
            notify "agent-ready #$NUMBER: $(jq -r .status <<<"$r"), no changes. $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            exit 0
          fi
          # The key never leaves this job inside a commit.
          if [ -n "$KEY" ] && git diff --cached | grep -qF "$KEY"; then
            notify "agent-ready #$NUMBER: refused, the diff contained the API key. Rotate the kd-public-runner key."
            exit 1
          fi
          type=$(jq -r .type <<<"$r"); slug=$(jq -r .slug <<<"$r")
          scope=$(jq -r .scope <<<"$r"); status=$(jq -r .status <<<"$r")
          title="$type${scope:+($scope)}: $(jq -r .subject <<<"$r")"
          branch="$type/$slug"
          git checkout -q -b "$branch"
          git -c user.name=kiwidesk-automation \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "$title" \
              -m "Drafted by the agent-ready workflow for #$NUMBER."
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          {
            jq -r .body <<<"$r"
            echo
            echo "**Status:** $status"
            echo
            echo "**Not verified here:**"
            jq -r '.not_verified[] | "- " + .' <<<"$r"
            echo
            echo "fixes #$NUMBER"
            echo
            echo "🤖 Drafted by the agent-ready workflow ([Claude Code](https://claude.com/claude-code)); the owner tests and reviews before it leaves draft."
          } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create --draft --base main --head "$branch" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md")
          # A PR opened with GITHUB_TOKEN fires no pull_request, so CI
          # is started for it (packaging-and-release.md ▸ CI).
          gh workflow run ci.yml --ref "$branch" || true
          notify "agent-ready #$NUMBER ($status): $url"
