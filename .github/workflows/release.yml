name: Release

# Cut by `scripts/release.sh`, which pushes the tag that fires
# this (#32). Nothing else should push a `v*` tag — the version
# in the tag and the version compiled into the binary are a
# hand-mirror, and the "Verify the tag matches the binary" step
# below is the guard that they agree.
on:
  push:
    tags: ['v*']
  # Re-run a release build without re-cutting the tag: a workflow
  # failure never needs a throwaway version number to retry.
  # Note this runs the workflow file from the DEFAULT branch, not
  # from the tag — so a retry of an old tag builds that tag's
  # source with today's pipeline.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.9.0)'
        required: true

# Never two builds of one tag racing to draft the same release.
# `ref_name`, NOT `ref`: a tag push gives `refs/tags/v0.9.0` while
# a dispatch input gives `v0.9.0`, so keying on `ref` would put a
# dispatch retry in a DIFFERENT group from the tag-push run it is
# retrying — leaving the one collision this exists to prevent as
# the only one it missed. `ref_name` is `v0.9.0` for both.
# No cancel-in-progress: a half-cancelled run can leave a draft
# holding a partial upload, and a release is cheap to wait for.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Bound once here for every job, never pasted into a `run:`
# body. A `${{ }}` expansion is substituted BEFORE bash parses
# the script, so a tag name carrying a quote or a newline would
# be executed rather than read. The trust boundary is "write
# access" — one person today — so this is hardening, not a live
# hole; it costs nothing and removes the class.
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # One copy for both jobs, read by the shell like TAG above: a
  # green Verify vouches for the exact toolchain the artifact is
  # then built with, so the two pins must be one string — an
  # Xcode bump that edited one job and not the other would leave
  # both green while the artifact is built by a compiler Verify
  # never ran.
  XCODE: /Applications/Xcode_26.6.app

jobs:
  # The gate scripts/release.sh runs before it will tag, re-run
  # against the tag itself. That script is the intended way to
  # cut a release — but a tag can also be pushed by hand,
  # skipping the gate entirely, and branch protection cannot see
  # tags. A bad merge to main is cheap to fix; a bad tag fans out
  # to Homebrew and the direct download and cannot be unshipped
  # (#487). Tests fail, nothing ships: the release job `needs:`
  # this one. VerifyGateParityTests pins this job's command list
  # to the verify-gate skill that owns the procedure.
  #
  # No `swift build -c release` here: the release job must keep
  # that compile ahead of any submission or draft — today it is
  # build-app.sh's first act — and the jobs run in sequence, so
  # this copy would only lengthen the critical path. The full
  # argument lives in packaging-and-release.md.
  verify:
    name: Verify
    # macos-26 for the same reason ci.yml pins it: the tree uses
    # macOS 26 SDK symbols, and `if #available` gates execution,
    # not compilation.
    runs-on: macos-26
    permissions:
      contents: read
      # Read-only, for the milestone gate below.
      issues: read
    # The commit this job vetted, for the release job to build.
    # A tag NAME is re-resolved against the remote at each job's
    # own checkout, so it cannot carry this assertion — see the
    # release job's checkout for what would slip through.
    outputs:
      sha: ${{ steps.audit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Needed for the "tag is on main" assertion below,
          # which resolves origin/main.
          fetch-depth: 0

      # Backstop for scripts/release.sh's copy of this check. The
      # script refuses to cut the tag at all; this catches a tag cut
      # by hand, or on a machine without gh. Placed before Xcode is
      # selected, so a release the milestone forbids costs seconds
      # rather than a whole build — and withholds the artifacts,
      # which is all CI can still do once the tag exists.
      - name: Milestone must be clear
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                   --milestone "$VERSION" --state open --json number \
                   --jq 'length' 2>/dev/null || echo 0)
          if [ "$OPEN" -gt 0 ]; then
            echo "::error::Milestone $VERSION still has $OPEN open issue(s) — the release waits for them."
            gh issue list --repo "$GITHUB_REPOSITORY" --milestone "$VERSION" \
              --state open --json number,title --jq '.[] | "  #\(.number) \(.title)"' || true
            exit 1
          fi
          echo "Milestone $VERSION is clear, or does not exist."

      # Not `github.sha`: on a workflow_dispatch run that is the
      # DEFAULT branch's tip, not the tag's commit — only the
      # clone knows what the ref above resolved to.
      - name: Record the audited commit
        id: audit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Strict, from the one workflow-level pin — and unlike
      # ci.yml's fallback, deliberately: see the release job's
      # Select Xcode for the argument.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          swift --version
          xcodebuild -version

      # The one guard that stops a mislabelled binary shipping.
      # The tag and KiwiDeskVersion.semantic are two hand-written
      # copies of one number: release.sh stamps the constant and
      # then tags, so they agree when that path is followed and
      # silently disagree the first time someone tags by hand.
      # Failing here costs a re-tag; not failing here ships a
      # binary whose --version output names a release it is not.
      # First in the gate, before the build: every step in this
      # job exists to fail a bad tag fast, and this one is the
      # cheapest.
      - name: Verify the tag matches the binary
        run: |
          EXPECTED="${TAG#v}"
          FILE=Sources/KiwiDeskCore/App/KiwiDeskVersion.swift
          # `head -1` matches build-app.sh's extraction. This is
          # the stricter of the two guards, so it must not be the
          # looser of the two parses.
          COMPILED="$(sed -n \
            's/.*let semantic = "\(.*\)".*/\1/p' "$FILE" | head -1)"
          if [ "$COMPILED" != "$EXPECTED" ]; then
            echo "::error::tag $TAG wants $EXPECTED but $FILE" \
                 "says '$COMPILED'. Cut releases with" \
                 "scripts/release.sh."
            exit 1
          fi
          # release.sh refuses to cut from anywhere but main, so a
          # tag off main is by definition one it did not make —
          # and "someone tagged by hand" is the threat this whole
          # step models.
          if ! git rev-parse -q --verify origin/main >/dev/null; then
            # Fatal, not skipped. origin/main resolves only because
            # `fetch-depth: 0` above fetches the remote branches;
            # trimming that for speed would turn this assertion
            # into a silent no-op, and a guard that cannot fail is
            # worse than no guard — it reads as protection.
            echo "::error::origin/main did not resolve, so the" \
                 "tag-on-main check could not run. The checkout" \
                 "needs fetch-depth: 0."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not an ancestor of main."
            exit 1
          fi
          echo "tag and binary agree on $EXPECTED"

      - name: Build
        run: swift build

      - name: Lint
        run: ./scripts/lint.sh

      # One `swift test`: the two-command split died with the
      # #494 tail-hang fix (.claude/rules/tests.md). ci.yml
      # keeps a two-step over ExecTests for per-partition
      # failure attribution; this job mirrors the skill instead,
      # and VerifyGateParityTests pins it there.
      - name: Test
        run: swift test


  release:
    name: Build & draft release
    needs: verify
    # macos-26 for the same reason ci.yml pins it: the tree uses
    # macOS 26 SDK symbols, and `if #available` gates execution,
    # not compilation.
    runs-on: macos-26
    permissions:
      # The draft and its assets — the one write this workflow
      # does. Verify above runs with read only.
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The exact commit Verify vetted — never the tag name,
          # which is re-resolved against the remote at THIS job's
          # start. By name, a tag deleted and re-pushed after
          # Verify passed (or a "Re-run failed jobs" of this job
          # alone, to which job outputs are replayed) would build
          # a tree that never met the gate. Everything below
          # reads the tag only as a NAME for the API — and the
          # one call that could recreate the ref, `gh release
          # create`, pins --target to this clone's HEAD.
          ref: ${{ needs.verify.outputs.sha }}
          # Shallow is enough here: the tag-on-main assertion
          # that needed origin/main (fetch-depth: 0) lives in
          # Verify now, and the release notes read nothing from
          # this clone — `--generate-notes` is computed
          # server-side by the API.

      # The pin above fails OPEN if its wiring ever breaks: a
      # renamed step id or output key evaluates to an empty
      # string with Verify still green, and checkout treats an
      # empty `ref` as unset — falling back to the DEFAULT
      # branch's tip on a workflow_dispatch run, after which
      # every later check self-agrees on the wrong tree (the
      # stamp and the binary check both read this clone's HEAD).
      # So prove the checkout resolved the pin, not a fallback.
      - name: Assert the vetted commit is checked out
        env:
          VETTED: ${{ needs.verify.outputs.sha }}
        run: |
          if [ -z "$VETTED" ]; then
            echo "::error::verify's sha output is empty — the" \
                 "audit step's wiring broke"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$VETTED" ]; then
            echo "::error::checked out $(git rev-parse HEAD)" \
                 "but verify vetted $VETTED"
            exit 1
          fi

      # No `|| /Applications/Xcode.app` fallback, deliberately
      # diverging from ci.yml. There the fallback is right: a test
      # run on a slightly different toolchain still tells you
      # something. Here the output is the artifact a user installs,
      # and a runner-image bump would silently build it with an
      # unannounced compiler while nothing on the artifact records
      # which. A release is precisely the run to stop rather than
      # let vary.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          swift --version
          xcodebuild -version

      - name: Resolve the tag
        id: tag
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Not a second copy of the sed in bump-version.sh — that
      # script owns the file's shape and this calls it. HEAD is
      # the tagged commit here, which is the one context where
      # stamping the commit is correct; see that script's header
      # for why the checked-in value is "unknown".
      - name: Stamp the exact build commit
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ./scripts/bump-version.sh "$VERSION" --stamp-commit
          git --no-pager diff --stat

      # `secrets` is not available in a step-level `if` (checked
      # against GitHub's context-availability table, 2026-07), so
      # their presence is lifted into an output the later steps
      # branch on. Absent secrets are not an error: build-app.sh
      # falls back to an ad-hoc signature, so the pipeline is
      # provable before any credential exists.
      #
      # Every secret the notarize branch goes on to use is checked
      # here, not just the key: setting all but one takes that
      # branch and fails inside `store-credentials`, burning a
      # tag's whole run for a missing string this step could have
      # named. The list below is the count — restating it as a
      # number in this sentence would be a second copy to keep in
      # step (rule-authoring.md).
      - name: Detect signing credentials
        id: creds
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no signing certificate — building" \
                 "ad-hoc, the artifact is NOT distributable"
          fi
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ] \
            && [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] \
            && [ -n "$NOTARY_ISSUER_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi
          # Sparkle's key is independent of both: it signs the
          # archive for the appcast and has nothing to do with
          # Gatekeeper. Lifted here rather than read as `secrets`
          # in a step-level `if` for the reason above — that
          # context reads empty and the step would silently skip.
          if [ -n "$SPARKLE_KEY" ]; then
            echo "sparkle=true" >> "$GITHUB_OUTPUT"
          else
            echo "sparkle=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no SPARKLE_PRIVATE_KEY — the" \
                 "archive gets no update signature, so this" \
                 "release cannot enter the appcast"
          fi

      # A throwaway keychain, unlocked for this run only. Its
      # password is generated here rather than stored as a secret:
      # it protects a keychain that ceases to exist with the
      # runner, so a stored one would be a credential to rotate
      # for no gain.
      - name: Import the signing certificate
        if: steps.creds.outputs.sign == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign \
            -T /usr/bin/security
          # Without this codesign blocks on a GUI prompt that no
          # runner can answer, and the job hangs until timeout
          # rather than failing.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # build-app.sh discovers the identity through
          # `security find-identity`, which reads the search
          # list — so the keychain has to JOIN it. Setting it as
          # the sole entry instead would drop the login keychain,
          # which is where notarytool stores its profile.
          # Read into an array the way build-app.sh does: the
          # runner's bash is 3.2, so there is no `mapfile`, and
          # an unquoted expansion would split a keychain path on
          # spaces. The trimming is left to sed rather than
          # nested parameter expansion — this path cannot be
          # exercised locally, so it is written to be obvious
          # rather than clever.
          existing=()
          while IFS= read -r line; do
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user \
            | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//')
          security list-keychains -d user -s "$KEYCHAIN" \
            "${existing[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          # An import can fail without failing this step, and the
          # consequence is quiet: build-app.sh would fall back to
          # ad-hoc and produce a correctly-shaped archive that is
          # merely unsigned. Assert the identity landed, so that
          # supplying the secret and getting an ad-hoc build is
          # not a thing that can happen silently.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q "Developer ID Application"; then
            echo "::error::certificate imported but no Developer" \
                 "ID Application identity is usable — check the" \
                 "certificate type and MACOS_CERT_PASSWORD"
            exit 1
          fi

      # An App Store Connect API key, not an Apple ID: it carries
      # no 2FA, is scoped to notarization and can be revoked
      # without touching the account. build-app.sh takes only the
      # profile NAME, so the credential never reaches its
      # command line.
      - name: Store the notarization profile
        if: steps.creds.outputs.notarize == 'true'
        env:
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool store-credentials kiwidesk-ci \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID"
          rm -f "$RUNNER_TEMP/key.p8"
          # Prove the profile reads BACK before spending a full
          # release build on it. `store-credentials` writes to the
          # DEFAULT keychain, which the step above deliberately
          # did not change — so this depends on the runner's login
          # keychain being present and unlocked, a property of the
          # image that nothing here controls and that cannot be
          # checked locally. Without this probe that assumption
          # fails as a notarytool auth error ten minutes later,
          # after the build; with it, it fails here in seconds.
          if ! xcrun notarytool history \
            --keychain-profile kiwidesk-ci >/dev/null 2>&1; then
            echo "::error::the notarization profile did not read" \
                 "back — check NOTARY_ISSUER_ID / NOTARY_KEY_ID" \
                 "and that the key has the Developer role"
            exit 1
          fi

      # Both artifacts come out of one build (#968). The
      # archive is what the Homebrew cask installs and what
      # Sparkle downloads; the disk image is the promoted
      # website download, and it is a SEPARATE piece of signed
      # code — the app's ticket does not travel with the image
      # carrying it, so `--notarize --dmg` submits twice and
      # staples each. build-app.sh owns all of that; this step
      # only has to ask for it.
      - name: Build the app
        env:
          NOTARIZE: ${{ steps.creds.outputs.notarize }}
        run: |
          ARGS=(--zip --dmg --output "$RUNNER_TEMP/app")
          if [ "$NOTARIZE" = "true" ]; then
            ARGS+=(--notarize kiwidesk-ci)
          fi
          ./scripts/build-app.sh "${ARGS[@]}"

      # build-app.sh names an un-notarized archive
      # `-unnotarized.zip` precisely so it cannot be mistaken for
      # a shippable one, so the name is read here rather than
      # reconstructed — reconstructing it is how a ticketless
      # artifact would get attached under a clean name.
      - name: Locate the archive
        id: archive
        run: |
          zips=()
          while IFS= read -r line; do
            [ -n "$line" ] && zips+=("$line")
          done < <(find "$RUNNER_TEMP/app" -maxdepth 1 -name '*.zip')
          # Exactly one, asserted rather than assumed. The
          # notarization payload is a .zip too and build-app.sh
          # deletes it — so two here means that cleanup regressed,
          # and picking either one silently would be a coin flip
          # between the stapled archive and the pre-staple one.
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::expected 1 archive, found" \
                 "${#zips[@]} in $RUNNER_TEMP/app"
            exit 1
          fi
          name="$(basename "${zips[0]}")"
          echo "path=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # upload-artifact zips whatever it is given, so a name
          # ending in .zip downloads as `….zip.zip`.
          echo "artifact=${name%.zip}" >> "$GITHUB_OUTPUT"

      # The image, read off disk for the same reason the archive
      # is: build-app.sh names an unstapled one
      # `-unnotarized.dmg` precisely so it cannot be mistaken for
      # a shippable one, and reconstructing the name here is how
      # a ticketless artifact would get attached under a clean
      # one.
      #
      # A second copy of the block above, because a GitHub step
      # is its own shell — a function defined in one is gone by
      # the next, so the shared helper this would otherwise be
      # cannot exist across steps. (Where extraction IS possible,
      # it is taken: `sibling_of` in the draft step below is one
      # copy of the rename convention for every artifact.) The
      # alternative is one step looping over both globs, which
      # trades a readable copy for dynamic output names on a path
      # that cannot be exercised before it runs for real — and
      # this file's standing choice there is obvious over clever.
      - name: Locate the disk image
        id: image
        run: |
          images=()
          while IFS= read -r line; do
            [ -n "$line" ] && images+=("$line")
          done < <(find "$RUNNER_TEMP/app" -maxdepth 1 \
            -name '*.dmg' ! -name '*-partial.dmg')
          # Exactly one, asserted rather than assumed — the point
          # is that a NAMED image exists at all, not that two
          # could race. build-app.sh removes both names before
          # `hdiutil` and renames under `set -e`, so the partial
          # and the finished image never coexist; what a bare
          # count would miss is the partial surviving ALONE,
          # after a staple that failed and an EXIT trap that
          # could not unlink it. That one is excluded by name
          # above rather than counted, so this step fails instead
          # of attaching a half-built image under a clean name.
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::expected 1 disk image, found" \
                 "${#images[@]} in $RUNNER_TEMP/app"
            exit 1
          fi
          echo "path=${images[0]}" >> "$GITHUB_OUTPUT"

      # Sparkle's signature over the archive (#874), produced
      # HERE because this is the one place that holds both the
      # bytes and the key. The appcast is written later, from the
      # PUBLISHED release — `release.yml` only ever drafts, and a
      # draft's asset URL 404s for everyone without auth, so an
      # item written now would advertise an update nobody can
      # fetch. The signature travels between the two as a sidecar
      # asset on the release; scripts/appcast-sync reads it there
      # and refuses a release that has none.
      #
      # `--ed-key-file -` is the automation form and `-s` is NOT:
      # sign_update 2.9.6 rejects `-s` outright for a key in the
      # current format ("no longer supported for newly generated
      # keys"), after printing a deprecation warning that reads
      # like a warning rather than a failure. Checked against the
      # tool, not its documentation.
      #
      # No download step: SwiftPM puts the tool on disk when it
      # resolves Sparkle, and `build-app.sh` has already built by
      # the time this runs.
      - name: Sign the archive for Sparkle
        id: edsig
        if: steps.creds.outputs.sparkle == 'true'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          set -euo pipefail
          TOOL=.build/artifacts/sparkle/Sparkle/bin/sign_update
          if [ ! -x "$TOOL" ]; then
            echo "::error::$TOOL is missing. It arrives with the" \
                 "Sparkle dependency, so this means the artifact" \
                 "layout moved on a version bump."
            exit 1
          fi
          # The signature is only worth anything if this key is
          # the one whose PUBLIC half every shipped bundle
          # carries. Signing and then verifying with the same
          # key proves the secret is self-consistent and nothing
          # else: a valid but WRONG key passes that happily, and
          # the first user to be offered the update is the one
          # who finds out — every installed copy rejects it, and
          # they are back to re-downloading by hand.
          #
          # So derive the public half and compare it to the
          # packager's own `SUPublicEDKey`. Node, because
          # LibreSSL — which is what `openssl` is on a macOS
          # runner — has no Ed25519 support, and hand-rolling
          # curve arithmetic in a release workflow is worse than
          # the problem. The derivation is checked against
          # RFC 8032's first test vector by
          # `SparkleKeyDerivationTests`.
          #
          # Both reads are tested for FAILURE, not for an empty
          # string. This step runs under `set -e`, so a failing
          # command substitution in an assignment aborts before
          # any `-z` test could run — a check written that way
          # is one that cannot fire, which reads as protection
          # and is not.
          if ! EXPECTED_PUB="$(python3 scripts/read-plist-key \
            SUPublicEDKey)"; then
            echo "::error::build-app.sh declares no" \
                 "SUPublicEDKey, so nothing says which key an" \
                 "installed copy trusts."
            exit 1
          fi
          if ! ACTUAL_PUB="$(printf '%s' "$SPARKLE_KEY" \
            | node scripts/sparkle-public-key.js)"; then
            echo "::error::could not derive a public key from" \
                 "SPARKLE_PRIVATE_KEY — the secret is not a" \
                 "Sparkle EdDSA key."
            exit 1
          fi
          if [ "$ACTUAL_PUB" != "$EXPECTED_PUB" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not the key" \
                 "this app trusts. Bundles ship" \
                 "SUPublicEDKey=$EXPECTED_PUB but the secret's" \
                 "public half is $ACTUAL_PUB. Signing with it" \
                 "would produce an update every installed copy" \
                 "refuses."
            exit 1
          fi
          echo "the signing key matches SUPublicEDKey"

          SIG="$(printf '%s' "$SPARKLE_KEY" \
            | "$TOOL" --ed-key-file - -p "$ARCHIVE")"
          if [ -z "$SIG" ]; then
            echo "::error::sign_update produced no signature."
            exit 1
          fi
          # Verify what was just produced, against the same key.
          # A signature the appcast carries but no installed copy
          # accepts is an update path that fails on every user's
          # machine and nowhere else — the one failure mode this
          # whole lane exists to prevent, and it costs a second
          # to rule out here.
          if ! printf '%s' "$SPARKLE_KEY" \
            | "$TOOL" --verify --ed-key-file - "$ARCHIVE" "$SIG" \
            >/dev/null 2>&1; then
            echo "::error::the signature just produced does not" \
                 "verify against SPARKLE_PRIVATE_KEY — the" \
                 "secret is corrupt or is not the key whose" \
                 "public half every build carries."
            exit 1
          fi
          SIDECAR="$ARCHIVE.edsig"
          printf '%s\n' "$SIG" > "$SIDECAR"
          echo "path=$SIDECAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$SIDECAR")" >> "$GITHUB_OUTPUT"
          echo "signed $(basename "$ARCHIVE")"

      # The acceptance criterion of #32, asserted against the
      # built binary rather than against the source it was built
      # from. Everything upstream — the stamp, the tag check —
      # reasons about a file on disk; this is the only step that
      # asks the artifact itself, so a build that silently
      # compiled a stale constant stops here.
      - name: Verify the built binary reports the release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          BIN="$RUNNER_TEMP/app/KiwiDesk.app/Contents/MacOS/KiwiDesk"
          OUT="$("$BIN" --version)"
          echo "kiwidesk --version -> $OUT"
          SHA="$(git rev-parse --short HEAD)"
          if [ "$OUT" != "$VERSION ($SHA)" ]; then
            echo "::error::binary reports '$OUT', expected" \
                 "'$VERSION ($SHA)'"
            exit 1
          fi

      # The archive only, and that is ruled rather than
      # forgotten: this channel is a 90-day retention convenience
      # for the artifact a cask or a re-run reaches for, while
      # the disk image's delivery IS the release asset — the one
      # place a person downloads it from. A second copy here
      # would be a second thing to keep in step with the draft.
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.archive.outputs.artifact }}
          path: ${{ steps.archive.outputs.path }}
          retention-days: 90
          # A UI "Re-run all jobs" reuses the run id, and v4
          # rejects a duplicate artifact name — after the whole
          # build has already been paid for.
          overwrite: true

      # DRAFT, deliberately and not as a placeholder. A published
      # release asset is a channel a user can install from, and
      # `docs/design-decisions.md` ("No distribution channel
      # without an update path") holds that shut until the build
      # can update itself. A draft is invisible and unfetchable
      # without auth, so the pipeline is provable end to end
      # without opening one. #105 owns the decision to publish.
      #
      # Notes are generated now rather than when that decision
      # lands: they are built from the history since the previous
      # tag, so generating them later would mean reconstructing
      # every past release's changelog by hand (#570 renders them
      # in Settings once they are public).
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
          IMAGE: ${{ steps.image.outputs.path }}
          SIDECAR: ${{ steps.edsig.outputs.path }}
        run: |
          # The archive, plus its Sparkle signature when the key
          # was present. An empty SIDECAR is the no-key build and
          # is not an error here — appcast-sync is what refuses
          # to offer a release that reaches it without one.
          # An `if`, not `[ -n … ] && …`. The default shell here
          # is `bash -e`, where an AND-list whose left side fails
          # is exempt from the exit — true, load-bearing, and
          # exactly the kind of rule this file has been bitten by
          # before. Nothing about this step can be exercised
          # locally, so it is written to be obvious.
          # Archive and image are both built on every run, so
          # both are unconditional — the signature is the one
          # that depends on a secret being present. An artifact
          # this job built and did not attach is invisible: the
          # run is green, the draft simply lacks it.
          UPLOADS=("$ARCHIVE" "$IMAGE")
          if [ -n "$SIDECAR" ]; then
            UPLOADS+=("$SIDECAR")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Drop every archive that is not the one being written,
            # because `--clobber` only replaces an asset of the
            # SAME name. The prescribed sequence — prove the
            # pipeline with no secrets, add credentials, re-run —
            # changes the archive's name (`-unnotarized.zip` to
            # `.zip`), so without this the draft ends up carrying
            # the un-notarized archive alongside the good one. The
            # naming convention stops a SCRIPT reaching for the
            # wrong file; it does nothing about a human publishing
            # a draft with both hanging off it.
            #
            # Read from the release rather than rebuilding the two
            # names from $VERSION: "Locate the archive" above takes
            # the name off disk precisely because reconstructing it
            # is how a ticketless artifact gets attached under a
            # clean one, and a rebuilt list here would silently
            # match nothing the day build-app.sh's scheme changes.
            KEEP="$(basename "$ARCHIVE")"
            KEEP_DMG="$(basename "$IMAGE")"
            # Captured, never read through a pipe. The default
            # shell here is `bash -e` WITHOUT pipefail, so a
            # failed `gh` on the left of a pipe yields empty
            # output that reads as "nothing stale attached" —
            # a guard against publishing both archives that
            # fails open into precisely that. scripts/release.sh
            # learned the same lesson for `git ls-remote`.
            if ! assets="$(gh release view "$TAG" --json assets \
              --jq '.assets[].name')"; then
              echo "::error::could not list the release's assets," \
                   "so a superseded archive may still be attached"
              exit 1
            fi
            # Delete the SIBLING name only, derived from the name
            # that came off disk — never a blanket "every other
            # zip". Both rules fail; they fail in opposite
            # directions, and this step cannot be exercised before
            # it runs for real, so take the one whose failure is
            # additive and visible on an unpublished draft over
            # the one that silently deletes a legitimate second
            # archive (per-arch zips are plausible once Sparkle
            # lands). Anything else unexpected is reported, not
            # removed.
            # ONE copy of that rename, applied per artifact.
            # `-unnotarized` is build-app.sh's convention and
            # this is the consuming side's single reading of it;
            # a per-artifact `case` block was the second, and a
            # third artifact would have made the forgotten arm
            # the silent failure — the clean name and the
            # unnotarized one both left on the draft, with the
            # one a person clicks decided by which sorts first.
            # Both artifacts reach here named by `find`, so the
            # extension is guaranteed present.
            sibling_of() {
              local name="$1"
              local ext="${name##*.}"
              local stem="${name%."$ext"}"
              case "$stem" in
                *-unnotarized) echo "${stem%-unnotarized}.$ext" ;;
                *) echo "$stem-unnotarized.$ext" ;;
              esac
            }
            SIBLING="$(sibling_of "$KEEP")"
            # The image takes the SAME rename across that
            # sequence, and it is the artifact a person clicks —
            # so a draft left carrying both would offer a
            # download named `-unnotarized.dmg` beside the good
            # one, which Gatekeeper refuses after a real download
            # and nothing here can see. Which of the two a person
            # reaches for is not something to find out.
            SIBLING_DMG="$(sibling_of "$KEEP_DMG")"
            # The signature is named after the archive it signs,
            # so the rename that supersedes one supersedes the
            # other. Left behind, the stale sidecar still matches
            # its stale archive's name — and appcast-sync pairs
            # BY name, so a draft re-run that dropped only the
            # zip would leave a signature that verifies nothing
            # sitting beside the good one.
            SIBLING_SIG="$SIBLING.edsig"
            # When THIS run produced no signature, any
            # `$KEEP.edsig` on the release is a previous run's,
            # and `gh release upload --clobber` has just
            # replaced the archive bytes underneath it. Keeping
            # it pairs a valid-looking signature with bytes it
            # does not sign — appcast-sync pairs by NAME and
            # checks only base64 and length, so that release
            # enters the feed and every installed copy
            # downloads it and then refuses to install. Treat it
            # as superseded, exactly like the renamed sibling.
            # Two names, because they answer two questions and
            # overloading SIBLING_SIG made it mean "the renamed
            # archive's signature" on one path and "this run's
            # own stale signature" on the other — which dropped
            # the renamed sibling's `.edsig` from the delete set
            # on the second path.
            if [ -n "$SIDECAR" ]; then
              KEEP_SIG="$KEEP.edsig"
              STALE_SIG=""
            else
              KEEP_SIG=""
              STALE_SIG="$KEEP.edsig"
            fi
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              # No `-n` short-circuit on the three sibling
              # names: `sibling_of` always answers, so a guard
              # there could never be false and would read as a
              # protection that is not one. STALE_SIG is the one
              # genuinely empty half the time — it is set only
              # when THIS run produced no signature — so it
              # keeps its guard.
              if [ "$asset" = "$SIBLING" ] \
                || [ "$asset" = "$SIBLING_SIG" ] \
                || { [ -n "$STALE_SIG" ] \
                     && [ "$asset" = "$STALE_SIG" ]; } \
                || [ "$asset" = "$SIBLING_DMG" ]; then
                echo "dropping superseded asset: $asset"
                if ! gh release delete-asset "$TAG" "$asset" \
                  --yes; then
                  echo "::warning::could not delete $asset — it" \
                       "may still be attached to the draft"
                fi
              elif [ "$asset" != "$KEEP" ] \
                && [ "$asset" != "$KEEP_SIG" ] \
                && [ "$asset" != "$KEEP_DMG" ]; then
                case "$asset" in
                  *.zip|*.edsig|*.dmg)
                    echo "::warning::unexpected archive, image" \
                         "or signature on the draft, left in" \
                         "place: $asset" ;;
                esac
              fi
            done <<< "$assets"
            # A draft outlives its tag (it mints no ref until
            # published) and is found here by NAME — so after a
            # delete-and-re-tag its stored target still names
            # the old commit, and a later publish following one
            # more tag deletion would mint the ref THERE, under
            # this run's artifact. Re-pin it beside the upload,
            # the same invariant the create branch sets.
            gh release edit "$TAG" \
              --target "$(git rev-parse HEAD)"
            gh release upload "$TAG" "${UPLOADS[@]}" --clobber
          else
            # --target: if the tag was deleted mid-run (a human
            # aborting a bad release), this call would otherwise
            # MINT it server-side at the default branch's
            # current tip — an ungated, unstamped commit, with
            # the vetted artifact attached under it. Pinned, a
            # minted tag lands on the vetted commit; with the
            # tag intact the flag is ignored.
            gh release create "$TAG" "${UPLOADS[@]}" \
              --draft \
              --prerelease \
              --title "KiwiDesk $VERSION" \
              --target "$(git rev-parse HEAD)" \
              --generate-notes
          fi
