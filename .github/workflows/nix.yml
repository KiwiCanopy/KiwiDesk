name: Update Nix flake

# The owner's publication is the event that advances KiwiCanopy/nix's
# KiwiDesk pin, and a manual dispatch retries an existing published
# release. Nix users have no Sparkle to fall back on, so a release is
# not complete until this run is green (docs/design-decisions.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to retry (e.g. v0.9.0)'
        required: true

permissions:
  contents: read

# One pin, one writer at a time; never cancel between commit and push.
concurrency:
  group: nix-flake
  queue: max
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  update:
    name: Update flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This supplies the updater, not release bytes. Use today's
          # protected main so a manual retry can repair an older release.
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify the published release asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          EXPECTED="KiwiDesk-$VERSION.zip"
          RELEASE="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"

          if [ "$(jq -r '.draft' <<< "$RELEASE")" != false ]; then
            echo "::error::$TAG is still a draft"
            exit 1
          fi
          # Selected BY NAME, never by counting and indexing: a
          # release also carries the .edsig and the .dmg.
          MATCHES="$(jq -c --arg want "$EXPECTED" \
            '[.assets[] | select(.name == $want)]' <<< "$RELEASE")"
          COUNT="$(jq 'length' <<< "$MATCHES")"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::$TAG must carry exactly one asset named" \
                 "$EXPECTED, found $COUNT. Assets present:"
            jq -r '.assets[].name' <<< "$RELEASE" | sed 's/^/  /'
            exit 1
          fi

          NAME="$(jq -r '.[0].name' <<< "$MATCHES")"
          STATE="$(jq -r '.[0].state' <<< "$MATCHES")"
          TYPE="$(jq -r '.[0].content_type' <<< "$MATCHES")"
          DIGEST="$(jq -r '.[0].digest' <<< "$MATCHES")"
          if [ "$STATE" != uploaded ] || [ "$TYPE" != application/zip ]; then
            echo "::error::$NAME is not an uploaded ZIP ($STATE, $TYPE)"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$NAME has no valid GitHub SHA-256 digest"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$NAME" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Download and verify the archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.release.outputs.asset }}
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir "$RUNNER_TEMP/release"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/release/$ASSET")"
          ACTUAL="${ACTUAL%% *}"
          if [ "$ACTUAL" != "$DIGEST" ]; then
            echo "::error::$ASSET digest is $ACTUAL, expected $DIGEST"
            exit 1
          fi

      - name: Require the flake deploy key
        env:
          DEPLOY_KEY: ${{ secrets.NIX_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::NIX_REPO_DEPLOY_KEY is not configured"
            exit 1
          fi

      - name: Check out KiwiCanopy/nix
        uses: actions/checkout@v7
        with:
          repository: KiwiCanopy/nix
          ref: main
          path: kiwicanopy-nix
          ssh-key: ${{ secrets.NIX_REPO_DEPLOY_KEY }}

      - name: Update and validate the source pin
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          scripts/update-nix-source.py \
            "$VERSION" "$DIGEST" \
            --source kiwicanopy-nix/pkgs/kiwidesk/source.json
          python3 -m json.tool \
            kiwicanopy-nix/pkgs/kiwidesk/source.json > /dev/null
          git -C kiwicanopy-nix diff --check

      - name: Commit and push the source pin
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          FILE=pkgs/kiwidesk/source.json
          if git -C kiwicanopy-nix diff --quiet -- "$FILE"; then
            echo "Nix flake already points to $TAG"
            exit 0
          fi
          git -C kiwicanopy-nix config user.name github-actions\[bot\]
          git -C kiwicanopy-nix config \
            user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git -C kiwicanopy-nix add "$FILE"
          git -C kiwicanopy-nix commit \
            -m "chore(kiwidesk): update to $VERSION"
          git -C kiwicanopy-nix push origin HEAD:main
