name: Changelog

# Regenerates site/src/data/changelog.json from the PUBLISHED
# release bodies and commits it, so Cloudflare Pages rebuilds the
# release-notes page on the push (#873).
#
# Why on `published` and not on `created`: release.yml drafts the
# release with `--generate-notes`, and the curated `## Highlights`
# block is written onto that draft by hand. A draft is therefore
# not yet the thing this page describes — CURATE THE DRAFT, THEN
# PUBLISH. Publishing first would show the raw generated list on
# the site until a correction landed.
#
# The parser in scripts/changelog-sync is the guard, not this
# file: run in `--release` mode it REFUSES a body with no curated
# block, an empty section, a missing summary or an issue number in
# a highlight, and names each problem. A template is a suggestion
# and drifts on the release someone is in a hurry for; a parser
# fails the workflow loudly instead of rendering a half-page.
#
# main is protected (#487), so this cannot push to it — the sync
# lands through a PR, exactly as the version stamp does.

on:
  release:
    types: [published]
  # Re-run by hand after fixing a refused body, or to rebuild the
  # whole file from every published release.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to sync. Leave empty to rebuild from every
          published release (a missing curated block is then kept
          as history rather than refused).
        required: false
        type: string

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  sync:
    name: Sync release notes to the site
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            python3 scripts/changelog-sync --release "$TAG"
          else
            python3 scripts/changelog-sync --all
          fi

      - name: Open a PR if anything moved
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/src/data/changelog.json; then
            echo "changelog.json already matches the published" \
                 "releases — nothing to do."
            exit 0
          fi
          LABEL="${TAG:-all}"
          BRANCH="chore/changelog-${LABEL}"
          MESSAGE="chore(site): sync release notes for ${LABEL}

          Generated by scripts/changelog-sync from the published
          release bodies. Never hand-edited — the next publish
          overwrites it."
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add site/src/data/changelog.json
          git commit -m "$MESSAGE"
          git push -f -u origin "$BRANCH"
          # A re-run after a refused body reuses the branch, so an
          # open PR is updated by the push above, never duplicated.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already open for $BRANCH — updated by push."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore(site): sync release notes for ${LABEL}" \
            --body "$MESSAGE

          Merging this rebuilds the release-notes page on
          Cloudflare Pages."
