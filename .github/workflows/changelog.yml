name: Release sync

# Regenerates the two site artifacts a PUBLISHED release writes
# back into the repo, and commits them together:
#
#   site/src/data/changelog.json  the release-notes page (#873)
#   site/public/appcast.xml       Sparkle's update feed (#874)
#
# ONE workflow and one PR for both, deliberately. They are
# generated from the same event and the same curated block — the
# feed's `<description>` is the text the page renders — so
# splitting them lets a release be readable on the site and
# un-offerable to the updater, or the reverse, with nothing
# reporting the gap. Landing them in one PR makes the two
# surfaces move together or not at all.
#
# Why the FEED is written here and not in release.yml, which is
# where the archive and the signing key are: release.yml only
# ever drafts, and a draft's asset URL 404s for anyone without
# auth. An item written at tag time would advertise an update
# every installed copy fails to download, throughout the
# human-length window while the highlights are being curated.
# The signature is still produced there, from the bytes that were
# just built, and travels here as a sidecar asset on the release.
#
# Why on `published` and not on `created`: release.yml drafts the
# release with `--generate-notes`, and the curated `## Highlights`
# block is written onto that draft by hand. A draft is therefore
# not yet the thing this page describes — CURATE THE DRAFT, THEN
# PUBLISH. Publishing first would show the raw generated list on
# the site until a correction landed.
#
# The parser in scripts/changelog-sync is the guard, not this
# file: run in `--release` mode it REFUSES a body with no curated
# block, an empty section, a missing summary or an issue number in
# a highlight, and names each problem. A template is a suggestion
# and drifts on the release someone is in a hurry for; a parser
# fails the workflow loudly instead of rendering a half-page.
#
# main is protected (#487), so this cannot push to it — the sync
# lands through a PR, exactly as the version stamp does.
#
# The feed goes LIVE when that PR merges and Cloudflare
# redeploys, which is the one ordering this design has to get
# right: the bytes are already published by then, because
# publication is what triggered this run.

on:
  release:
    types: [published]
  # Re-run by hand after fixing a refused body, or to rebuild the
  # whole file from every published release.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to sync. Leave empty to rebuild from every
          published release (a missing curated block is then kept
          as history rather than refused).
        required: false
        type: string

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the notes and the update feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # `gh workflow run` on the branch this job pushes — the one
      # way a `github.token` PR ever gets a check run (#1154).
      actions: write
    env:
      # ONE home for the token the push, the PR and the arming
      # all take. A `github.token` PR fails three gates, all
      # measured on v1.1.2's #1191: it raises no `pull_request`,
      # it is held at "Approve and run", and the merge queue
      # will not take an entry it armed. A real actor's token
      # clears all three; without one this falls back and the
      # dispatch below keeps the cheap half working (#1154).
      SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN || github.token }}
      # Whether that resolved to the PAT. The dispatch exists
      # ONLY because `github.token` fires nothing, so a PAT run
      # must not also fire it — two suites reporting the same
      # required contexts is a race over which one lands.
      SYNC_TOKEN_IS_PAT: ${{ secrets.RELEASE_SYNC_TOKEN != '' }}
    steps:
      - name: Check out main with the token that will push
        uses: actions/checkout@v7
        with:
          ref: main
          # The token the later `git push` inherits: what fires
          # `pull_request` is who pushed and opened, not who
          # authored the commit.
          token: ${{ env.SYNC_TOKEN }}
          persist-credentials: true

      # Read from site/.nvmrc, never a literal — that file is the
      # one Node pin (.claude/rules/site.md), shared with site.yml
      # and a local `nvm use`, and Astro refuses anything older.
      - uses: actions/setup-node@v7
        # Shadowed, not inherited: the job-level token is a real
        # actor's, and `npm ci` below runs lifecycle scripts from
        # the site's whole dependency tree. `permissions:` cannot
        # narrow a PAT, so a step that does not CONSUME it says so
        # — `ReleaseSyncTriggerTests` holds every step to one or
        # the other (code review, #1154).
        env:
          SYNC_TOKEN: ""
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Sync
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          # The event's tag alone, never the dispatch input. The
          # appcast guard below is about a PUBLICATION — "the
          # release we just published must be offerable" — while a
          # dispatch naming an old tag is a rebuild, and every
          # release before the updater legitimately has no
          # signature to find.
          PUBLISHED: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Two calls, and the split is deliberate.
          #
          # --release --check is the GUARD: strict mode, so this
          # release's body must carry a curated block the page can
          # render, and the step fails naming every problem.
          # It writes nothing.
          #
          # --all is what actually writes, and it rebuilds from
          # EVERY published release rather than merging one entry
          # into whatever main happens to hold. That matters
          # because this job checks out main: if an earlier sync
          # PR has not merged yet, main's file is missing that
          # release, and a merge-one-entry write would carry the
          # gap forward silently. A full rebuild cannot.
          if [ -n "$TAG" ]; then
            python3 scripts/changelog-sync --release "$TAG" --check
          fi
          python3 scripts/changelog-sync --all

          # The feed, in the same two shapes and in this order:
          # appcast-sync reads the notes out of the file the call
          # above just wrote, so the update window and the site
          # quote one corpus rather than two.
          #
          # ONE invocation on the publish path, not a strict
          # `--check` followed by a separate `--all`. The split
          # looked safer and was not: the two calls fetch the
          # releases independently, so the check could pass and
          # the write could then produce a feed without that
          # release — green run, opened PR, newest version
          # missing. `--release <tag>` holds the tag to every
          # clause AND refuses to write a feed it does not end
          # up in.
          #
          # `--all` stays the dispatch path, where the job is a
          # rebuild rather than a publication and every release
          # from before the updater legitimately has no
          # signature to find.
          if [ -n "$PUBLISHED" ]; then
            python3 scripts/appcast-sync --release "$PUBLISHED"
          else
            python3 scripts/appcast-sync --all
          fi

      # Retire the docs markers this release ships (#1232).
      #
      # HERE and not in release.yml, for the reason the feed is
      # here: a marker means "not in a release", and publication
      # is what makes that false. It rides this PR because the
      # curated notes are what a reader of that PR is already
      # checking, and the list below is the same question one
      # shelf over — "these blocks now claim to be shipped; are
      # they?" A block whose feature slipped OUT of the release
      # is unmarked wrongly, and this is the only place that is
      # visible.
      #
      # The script checks that its rewrite LANDED, and no more:
      # it re-reads through the parser that did the rewrite, so a
      # marker that parser cannot see is invisible to it too.
      # What catches THAT is the site build below —
      # `check-site-tokens.py` compares the sweep's count against
      # the badges the real pipeline rendered, which is why the
      # build runs after this step and not before it.
      - name: Retire the docs markers this release ships
        # PUBLICATION only. `workflow_dispatch` above is a
        # REBUILD — of a refused body, or of the whole file from
        # every published release — and nothing published at that
        # moment, so a sweep there would unmark blocks that are
        # genuinely unreleased and then let this job's own
        # auto-merge land them unattended. Unmarking early is the
        # unsafe direction: the page then claims something ships
        # that does not, with nothing on it to hint otherwise.
        #
        # A dispatch re-run after a refused body therefore leaves
        # the markers standing for one more release, which is the
        # bounded, already-accepted direction of this trade
        # (.claude/rules/site.md).
        #
        # `docs` stays in SYNCED unconditionally: when this step
        # does not run the tree is unchanged, so staging it costs
        # nothing and the entry needs no second condition to keep
        # in step with this one.
        if: github.event_name == 'release'
        env:
          SYNC_TOKEN: ""
        run: |
          set -euo pipefail
          python3 scripts/unreleased-strip | tee /tmp/unmarked.txt

      # A PR opened with `github.token` does NOT trigger other
      # workflows — GitHub's loop prevention — so `site.yml` will
      # not run on the sync PR even though it touches `site/**`.
      # The page is the only consumer of this file, so the build
      # is the check that it renders, and it has to happen HERE or
      # nowhere. Cheap, and it fails before a PR exists rather
      # than after Cloudflare has published a broken page.
      - name: Prove the page still builds
        env:
          SYNC_TOKEN: ""
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # The site gate, run HERE because the FALLBACK path
          # needs it: a PR opened with `github.token` fires no
          # workflows, so `site.yml` never sees that one — and
          # `check-site-tokens.py` is where the assertion that
          # the feed is actually served lives. Without this call
          # the feed is the one artifact that reaches `main`
          # with its own guard never having run on it.
          python3 ../scripts/check-site-tokens.py --dist dist
          # The plugin's own subject. The corpus is empty of
          # markers by the time this runs — the step above just
          # retired them — so the artifact clauses above are
          # vacuous on this path and this is the only thing
          # exercising the marker at all (#1232).
          node test-unreleased.mjs
        working-directory: site

      # One step for all three: the branch name is the thread
      # through them.
      - name: Open a PR if anything moved, and let it land
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          SYNCED=(site/src/data/changelog.json
                  site/public/appcast.xml
                  docs)
          if git diff --quiet -- "${SYNCED[@]}"; then
            echo "the notes, the feed and the docs markers" \
                 "already match the published releases —" \
                 "nothing to do."
            exit 0
          fi
          # The unmarked-blocks paragraph is written ONLY when
          # something was unmarked. A human reading it is this
          # design's one net for a block whose feature slipped out
          # of the release, and boilerplate on every release is
          # what trains a reader to skip it (#1232).
          RETIRED=""
          if grep -q "^  - " /tmp/unmarked.txt 2>/dev/null; then
            RETIRED="

          These docs blocks no longer say \`Unreleased\`:

          $(cat /tmp/unmarked.txt)

          If one of them describes something that did NOT ship in
          this release, put its \`:::unreleased\` marker back on
          this branch before merging."
          fi
          LABEL="${TAG:-all}"
          BRANCH="chore/changelog-${LABEL}"
          MESSAGE="chore(site): sync release notes and feed for ${LABEL}

          Generated by scripts/changelog-sync and
          scripts/appcast-sync from the published releases.
          Neither file is hand-edited — the next publish
          overwrites both."
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "${SYNCED[@]}"
          git commit -m "$MESSAGE"
          git push -f -u origin "$BRANCH"
          # A re-run after a refused body reuses the branch, so an
          # OPEN PR is updated by the push above, never duplicated.
          # The state test is load-bearing: `gh pr view` also finds
          # a MERGED or CLOSED PR for the same branch name, and
          # treating that as "already open" would strand the new
          # commit with no PR and no failure.
          STATE="$(gh pr view "$BRANCH" --json state \
            --jq .state 2>/dev/null || true)"
          if [ "$STATE" = "OPEN" ]; then
            echo "PR already open for $BRANCH — updated by push."
          else
            gh pr create --base main --head "$BRANCH" \
              --title \
              "chore(site): sync release notes and feed for ${LABEL}" \
              --body "$MESSAGE

          Merging this rebuilds the release-notes page AND puts
          the new version in front of every installed copy — the
          appcast is live the moment Cloudflare redeploys.$RETIRED"
          fi

          # Start CI by hand when — and only when — nothing
          # else will, which is the `github.token` fallback;
          # packaging-and-release.md ("CI") carries why. On that
          # path every run dispatches, the already-open one
          # included: the push above moved the head, and the
          # checks that count are the ones on it.
          if [ "$SYNC_TOKEN_IS_PAT" != "true" ]; then
            gh workflow run ci.yml --ref "$BRANCH" \
              -f filter_paths=true
          fi

          # Arm the queue, so a green release needs no human
          # between publishing and the feed going live. A re-run
          # finds it already armed, which is success — but only
          # ASKING says so. A swallowed failure would print that
          # sentence with nothing armed and leave the job green,
          # which is the invisible "somebody has to notice"
          # state this whole change exists to end.
          if ! gh pr merge "$BRANCH" --auto --squash; then
            ARMED="$(gh pr view "$BRANCH" \
              --json autoMergeRequest --jq .autoMergeRequest)"
            if [ -z "$ARMED" ] || [ "$ARMED" = "null" ]; then
              echo "::error::auto-merge is not armed on $BRANCH"
              exit 1
            fi
            echo "auto-merge was already armed for $BRANCH."
          fi
