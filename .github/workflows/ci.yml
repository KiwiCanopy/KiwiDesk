name: CI

# push runs post-merge on main; pull_request runs pre-merge on
# branches. Scoping push to main avoids a duplicate run on every
# PR-branch push (which would otherwise fire both push and
# pull_request for the same commit). A long-lived release branch
# (release/3.0.0, owner ruling 2026-10-09) is a merge target like
# main, so it takes both triggers too.
#
# The expensive jobs are gated on a `changes` job rather than on a
# trigger-level `paths-ignore`, and that is the whole point: a
# workflow filtered out at the trigger never reports a check run at
# all, so a required status check would wait forever on it. A job
# *skipped* by `if:` satisfies a required check. Same macOS minutes
# saved either way; only this shape survives branch protection
# (#487, scripts/protect-main.sh).
#
# The list itself lives in .github/ci-ignore.txt — one authority,
# read by the job below, by CiPathFilterTests and by the
# verify-gate skill. packaging-and-release.md ("CI") owns when an
# entry may be added.
on:
  push:
    branches: [main, release/3.0.0]
  pull_request:
    branches: [main, release/3.0.0]
  # Manual "Run workflow" button in the Actions tab. Additive — the
  # automatic triggers above still fire. Useful while the repo is
  # private, where macOS runners bill at a 10x multiplier against a
  # 2,000-minute allowance; on a public repo Actions is free and this
  # is just a convenience for re-running without an empty commit.
  #
  # It is also how `changelog.yml` gets CI onto a PR it opened —
  # packaging-and-release.md ("CI") carries that argument.
  workflow_dispatch:
    inputs:
      filter_paths:
        description: >-
          Apply .github/ci-ignore.txt, the way a pull_request run
          does. ON for a workflow dispatching this one in place
          of the pull_request it cannot fire. OFF for the button,
          which is the manual override for a WRONG entry on that
          list — the one failure this filter has actually cost
          somebody (#661) — and an override that re-read the list
          would be no override at all.
        required: false
        default: false
        type: boolean

# A superseded PR run is cancelled; a push to main or a release
# branch always finishes,
# so every merged commit gets a verdict and the README badge
# (main's pushes only) never reads a cancelled run as failing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main'
    && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  changes:
    name: Detect relevant changes
    # ubuntu, not macOS: this runs on every push and bills at 1x.
    # It exists to stop the 10x jobs below, so it has to be
    # cheap enough that the trade is never in question.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
      light: ${{ steps.filter.outputs.light }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both diff bases below are commits on this repo, and a
          # shallow clone would not contain them.
          fetch-depth: 0

      - name: Decide whether the build jobs must run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FILTER: ${{ inputs.filter_paths }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every unknown resolves to "run". A false negative here
          # skips CI on a real change and is invisible; a false
          # positive costs one build.
          case "$EVENT" in
            pull_request) base="$BASE" ;;
            push)         base="$BEFORE" ;;
            # Only when the dispatcher asked for it. A dispatch
            # standing in for a pull_request wants that event's
            # filtering; the button means "run everything", and
            # the fork point is what a pull_request would have
            # compared against anyway. An unresolvable one falls
            # through to the same "run everything" below.
            workflow_dispatch)
              base=""
              if [ "$FILTER" = "true" ]; then
                base="$(git merge-base \
                  "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null \
                  || true)"
              fi
              ;;
            *)            base="" ;;
          esac
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable base for $EVENT — running everything"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a file moved into an ignored or
          # instruction path still names the path it left.
          if [ "$EVENT" = "pull_request" ]; then
            changed="$(git diff --name-only --no-renames \
              "$base"...HEAD)"
          else
            changed="$(git diff --name-only --no-renames \
              "$base" HEAD)"
          fi
          if [ -z "$changed" ]; then
            echo "empty diff — running everything"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release stamp alone skips (#2106); what gates it is
          # downstream, scripts/ci-stamp-only says what. Only this
          # repo's own branches, since a fork names its branch
          # freely, and the judge is read from the BASE commit, so
          # a PR cannot rewrite it; no script there answers no.
          stamp_check=""
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            stamp_check="$(git show "${base}:scripts/ci-stamp-only" \
              2>/dev/null || true)"
          fi
          if [ -n "$stamp_check" ] \
            && bash -c "$stamp_check" ci-stamp-only "$HEAD_REF" "$base"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          # A change confined to `.claude/` and AGENTS.md takes the
          # light lane (#2712): lint and the suites that read them,
          # listed in .github/ci-instruction-readers.txt. Any other
          # path runs everything, and so does a push: main's push
          # run stays the full-suite backstop.
          light=false
          lane=false
          case "$EVENT" in
            pull_request) lane=true ;;
            workflow_dispatch) lane="$FILTER" ;;
          esac
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            ignored=false
            while IFS= read -r pattern; do
              case "$pattern" in ''|\#*) continue ;; esac
              case "$pattern" in
                */'**')
                  case "$file" in
                    "${pattern%/\*\*}"/*) ignored=true ;;
                  esac
                  ;;
                *)
                  [ "$file" = "$pattern" ] && ignored=true
                  ;;
              esac
              [ "$ignored" = true ] && break
            done < .github/ci-ignore.txt
            [ "$ignored" = true ] && continue
            if [ "$lane" = true ]; then
              case "$file" in
                .claude/*|AGENTS.md)
                  echo "instruction file: $file"
                  light=true
                  continue
                  ;;
              esac
            fi
            echo "not ignored: $file"
            run=true
            light=false
            break
          done <<< "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "light=$light" >> "$GITHUB_OUTPUT"

  # Each test target compiles and runs on a runner of its own: `swift
  # test --test-product` builds that target and its dependencies, where
  # a whole test build costs the two in series. The flag is hidden in
  # SwiftPM, so a removal reds here rather than silently widening.
  # `CiRequiredJobTests` holds every test target to one of these jobs.
  test-gui:
    needs: changes
    # A failed or timed-out filter runs everything: a bare `if:`
    # implies success(), and the skip it makes passes a required
    # check with nothing run (#1984).
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.run == 'true') }}
    name: Build, Lint & Test GUI
    # xcode-27 (macOS 27, a preview image, #1500) with Xcode 27.2,
    # which the image ships beside its 27.1 default:
    # the toolchain the tree is developed on. The tree needs at
    # least the macOS 26 SDK (NSGlassEffectView, #390) — `if
    # #available` gates execution, not compilation — and the
    # deployment target is unchanged, so the binary still runs on
    # older macOS.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          if ! sudo xcode-select -s /Applications/Xcode_27.2.app; then
            echo "::warning::Xcode_27.2.app is gone; fell back to" \
              "Xcode.app, which release.yml will not do"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          swift --version
          xcodebuild -version

      # The warning ratchet (#1594): swiftc errors on anything
      # but a deprecation, which stays a warning while
      # AXHelper's `activateIgnoringOtherApps` call is #1170's
      # to remove — an exemption held live by
      # `WarningRatchetWorkflowTests`. The debug build alone:
      # the release job takes no ratchet, so a new toolchain's
      # diagnostics can never block a release
      # (packaging-and-release.md ▸ CI).
      #
      # `-Xswiftc` reaches every target swiftc compiles from
      # source, which today is this package's own; Vendor/CLua
      # is clang's and unreached. The Test steps pass the same
      # -Xswiftc arguments (#1596, packaging-and-release.md ▸
      # the ratchet; `WarningRatchetWorkflowTests`).
      #
      # `scripts/warning-gate` fails on any warning left in the
      # output outside that exemption: an isolation inherited
      # from an SDK class stays a warning `-warnings-as-errors`
      # cannot promote (#1780).
      - name: Build
        run: >-
          scripts/warning-gate swift build
          -Xswiftc -warnings-as-errors
          -Xswiftc -Wwarning -Xswiftc DeprecatedDeclaration

      - name: Lint
        run: ./scripts/lint.sh

      # The old tail-stall died with #494; the split is kept for
      # failure attribution — a hang or leak in a real-child
      # suite points at the exec step. The skip/filter matches
      # suite TYPE names, so exec-child suites carry the
      # ExecTests prefix (.claude/rules/tests.md, pinned by
      # MachineTouchTests).
      - name: Test (GUI)
        run: >-
          scripts/warning-gate swift test
          --test-product KiwiDeskGuiTests --skip ExecTests
          -Xswiftc -warnings-as-errors
          -Xswiftc -Wwarning -Xswiftc DeprecatedDeclaration

      - name: Test (GUI ExecTests)
        run: >-
          scripts/warning-gate swift test
          --test-product KiwiDeskGuiTests --filter ExecTests
          -Xswiftc -warnings-as-errors
          -Xswiftc -Wwarning -Xswiftc DeprecatedDeclaration

  test-core:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.run == 'true') }}
    name: Test Core
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          if ! sudo xcode-select -s /Applications/Xcode_27.2.app; then
            echo "::warning::Xcode_27.2.app is gone; fell back to" \
              "Xcode.app, which release.yml will not do"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          swift --version
          xcodebuild -version

      - name: Test (Core)
        run: >-
          scripts/warning-gate swift test
          --test-product KiwiDeskCoreTests --skip ExecTests
          -Xswiftc -warnings-as-errors
          -Xswiftc -Wwarning -Xswiftc DeprecatedDeclaration

      - name: Test (Core ExecTests)
        run: >-
          scripts/warning-gate swift test
          --test-product KiwiDeskCoreTests --filter ExecTests
          -Xswiftc -warnings-as-errors
          -Xswiftc -Wwarning -Xswiftc DeprecatedDeclaration

  # The light lane's suites: those reading `.claude/` or
  # AGENTS.md, held to the tree by CiInstructionLaneTests.
  instruction-readers:
    needs: changes
    # Only the filter's own answer: a failed filter runs everything.
    if: >-
      ${{ needs.changes.result == 'success'
      && needs.changes.outputs.light == 'true' }}
    name: Instruction Readers
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          if ! sudo xcode-select -s /Applications/Xcode_27.2.app; then
            echo "::warning::Xcode_27.2.app is gone; fell back to" \
              "Xcode.app, which release.yml will not do"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          swift --version
          xcodebuild -version

      - name: Lint
        run: ./scripts/lint.sh

      # The filter on its own line, so a refusal fails the step.
      - name: Instruction readers
        run: |
          filter="$(scripts/ci-instruction-filter)"
          scripts/warning-gate swift test --filter "$filter" \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -Wwarning -Xswiftc DeprecatedDeclaration

  # The required context (scripts/protect-main.sh), so the jobs above
  # can change without a ruleset edit. It runs whatever they did and
  # fails closed: a job the filter owed must have succeeded, since a
  # skip would otherwise pass the check with nothing run (#1984).
  build-lint-test:
    needs: [changes, test-gui, test-core, instruction-readers]
    if: ${{ !cancelled() }}
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Judge the test jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          LIGHT: ${{ needs.changes.outputs.light }}
          GUI: ${{ needs.test-gui.result }}
          CORE: ${{ needs.test-core.result }}
          READERS: ${{ needs.instruction-readers.result }}
        run: |
          echo "changes=$CHANGES run=$RUN light=$LIGHT" \
            "gui=$GUI core=$CORE readers=$READERS"
          for result in "$GUI" "$CORE" "$READERS"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
          # Only an explicit `run=false` owes less than the full run.
          if [ "$CHANGES" != "success" ] || [ "$RUN" != "false" ]; then
            [ "$GUI" = "success" ] && [ "$CORE" = "success" ]
          elif [ "$LIGHT" = "true" ]; then
            [ "$READERS" = "success" ]
          fi

  release-build:
    needs: changes
    # A failed or timed-out filter runs everything: a bare `if:`
    # implies success(), and the skip it makes passes a required
    # check with nothing run (#1984).
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.run == 'true') }}
    name: Release Build
    # A sibling job, not a step in test-gui: `swift test` there
    # already compiles the tree in debug, so building release in
    # the same job compiles it twice in series and
    # grows the pipeline by the release build's full wall clock.
    # As a parallel job it costs nothing on the critical path.
    #
    # This is the gate the verify-gate skill no longer asks every commit to
    # pay locally: the optimizer turns on concurrency diagnostics
    # (non-Sendable captures in `@Sendable` closures) the debug
    # build silently accepts. #532.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          if ! sudo xcode-select -s /Applications/Xcode_27.2.app; then
            echo "::warning::Xcode_27.2.app is gone; fell back to" \
              "Xcode.app, which release.yml will not do"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          swift --version
          xcodebuild -version

      - name: Build (release)
        run: swift build -c release
