name: Site

# Builds the Astro/Starlight docs site so a broken build is caught
# in the PR gate, not on Cloudflare after merge. Path-filtered to
# the site and the content it renders (docs/ and assets/ are
# symlinked into the site, so a docs edit can break the build).
# pull_request has no branch filter so it also validates the
# stacked docs → site PR chain before either reaches main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "assets/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "assets/**"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from site/.nvmrc so CI and a local `nvm use`
          # cannot drift apart — a literal here would silently
          # keep handing contributors the old version.
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Guard the site locale manifests the same way the app locales
      # are guarded: hard-fail on a malformed <locale>.json and warn on
      # orphan keys. The script self-resolves the repo root, so the
      # site working-directory is fine (../scripts reaches it).
      - name: Check locale manifests
        run: python3 ../scripts/extract-keys --site --check

      # The light-mode AA green-text literal is ONE decision with two
      # homes here — theme.css (Starlight/docs) and landing.css (the
      # landing, guide and 404) — because neither stylesheet imports
      # the other. #635 found them independently derived and one
      # notch apart. This reads both values out of the files and
      # compares them, so no third copy of the number lives in this
      # workflow and a one-sided edit fails the gate.
      #
      # What it cannot see: the same value is shared with
      # kiwicanopy.com and KiwiCV. Keeping THAT in step is a review
      # obligation (.claude/rules/site.md), not something CI can check.
      - name: Check the AA green-text literal agrees
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          def light(path, prop):
              src = pathlib.Path(path).read_text()
              head, sep, rest = src.partition(':root[data-theme="light"]')
              if not sep:
                  sys.exit(f"{path}: no light-theme token block")
              block = rest.split("}", 1)[0]
              m = re.search(prop + r":\s*(#[0-9a-fA-F]{6})", block)
              if not m:
                  sys.exit(f"{path}: no {prop} hex in the light block")
              return m.group(1).lower()

          a = light("src/styles/theme.css", "--sl-color-accent")
          b = light("src/styles/landing.css", "--accent")
          print(f"theme.css {a}  landing.css {b}")
          if a != b:
              sys.exit(
                  "the light-mode AA green-text literal disagrees "
                  "across the two stylesheets (#635) — they are one "
                  "decision and must carry one value"
              )
          PY
