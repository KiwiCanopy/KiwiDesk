name: Site

# Builds the Astro/Starlight docs site so a broken build is caught
# in the PR gate, not on Cloudflare after merge. Builds only for
# the site and the content it renders (docs/ and assets/ are
# symlinked into the site, so a docs edit can break the build).
#
# SupportLinks.swift is here because check-site-tokens.py reads it
# (#1019): it names the guide routes the APP links, and the check
# that the site serves them is only sound if it runs when either
# side moves. NextOnMyList.swift is here on the same ground for
# the file the What's new window fetches (#1813), and ROADMAP.md
# because the build reads it and refuses a malformed section.
# unreleased-strip is here on that same ground twice
# over (#1232): this gate RUNS it against the corpus, and
# check-site-tokens.py IMPORTS it for the marker's grammar, so an
# edit to it that reds the real docs would otherwise reach main
# with nothing having run it. The script itself is here for the
# same reason one
# level up — editing a check did not previously run it, and
# several of its checks read inputs from outside site/. Both are
# inputs to the GATE, not to the build, and so are extract-keys,
# which the gate runs, and build-app.sh, whose feed URL
# check-site-tokens.py reads. Written without a count:
# #1232 moved it, and a number here is one nothing derives.
# pull_request has no branch filter so it also validates the
# stacked docs → site PR chain before either reaches main.
#
# `Build site` is a required check on main
# (scripts/protect-main.sh), so pull_request takes no `paths:`: a
# filtered-out workflow never reports and a required check waits
# forever, while a job skipped by `if:` satisfies one. The `changes`
# job applies push's list below, the one list of the site's inputs,
# and builds when it cannot read an entry.
# push keeps the trigger filter, so a Swift-only merge cannot cancel
# a site run through the concurrency group.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "assets/**"
      - "Sources/KiwiDesk/SupportLinks.swift"
      - "Sources/KiwiDesk/Updates/NextOnMyList.swift"
      - "ROADMAP.md"
      - "scripts/check-site-tokens.py"
      - "scripts/unreleased-strip"
      - "scripts/extract-keys"
      - "scripts/build-app.sh"
      - ".github/workflows/site.yml"
  pull_request:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect site changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff base is a commit on this repo, and a shallow
          # clone would not contain it.
          fetch-depth: 0

      - name: Decide whether the site must build
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Every unknown resolves to "run": a wrong skip passes a
          # required check with nothing built.
          answer() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # A push already passed the trigger's own `paths:`.
          [ "$EVENT" = pull_request ] || answer true
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || answer true
          # --no-renames: a file moved out of an input still names
          # the path it left.
          changed="$(git -c core.quotePath=false diff --name-only \
            --no-renames "$BASE"...HEAD)"
          inputs="$(awk '
            /^    paths:$/ { list = 1; next }
            !list { next }
            /^ *(#.*)?$/ { next }
            !/^      / { exit }
            /^      - "[^" ]*"$/ { gsub(/^      - "|"$/, ""); print; next }
            { print "*" }
          ' .github/workflows/site.yml)"
          if [ -z "$changed" ] || [ -z "$inputs" ]; then
            answer true
          fi
          while IFS= read -r file; do
            # Git still quotes a name holding a quote or a control
            # character, and a quoted name matches nothing.
            case "$file" in \"*) answer true ;; esac
            while IFS= read -r input; do
              case "$input" in
                */'**')
                  case "$file" in
                    "${input%/\*\*}"/*) answer true ;;
                  esac
                  ;;
                # Only `dir/**` and exact paths are compared here.
                *'*'*|*'?'*|*'['*) answer true ;;
                "$file") answer true ;;
              esac
            done <<< "$inputs"
          done <<< "$changed"
          answer false

  build:
    needs: changes
    # A failed or timed-out filter builds: a bare `if:` implies
    # success(), and the skip it makes passes a required check with
    # nothing run (#1984).
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.run == 'true') }}
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read from site/.nvmrc so CI and a local `nvm use`
          # cannot drift apart — a literal here would silently
          # keep handing contributors the old version.
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Guard the site locale manifests the same way the app locales
      # are guarded: hard-fail on a malformed <locale>.json and warn on
      # orphan keys. The script self-resolves the repo root, so the
      # site working-directory is fine (../scripts reaches it).
      - name: Check locale manifests
        run: python3 ../scripts/extract-keys --site --check

      # The shared brand-token and branded-404 guards. The script's
      # own docstring carries the argument for each check; --dist
      # enables the one that needs the build output, and takes a
      # path so a missing dist/ is an error rather than a quietly
      # skipped assertion.
      - name: Check the shared brand tokens and the branded 404
        run: python3 ../scripts/check-site-tokens.py --dist dist

      # The typed release notes' own subject (#1542): the corpus
      # holds no typed release before 2.0.0, so the built-page
      # check above goes vacuous until then.
      - name: Check the typed changelog view
        run: node test-changelog.mjs

      # The roadmap parser's own subject (#1813), over fixtures and
      # the real ROADMAP.md.
      - name: Check the roadmap section
        run: node test-roadmap.mjs

      # The looks gallery's Discover rotation (#1740), over
      # synthetic galleries: the live index is too young to have
      # run a cycle.
      - name: Check the looks rotation
        run: node test-looks-order.mjs

      # The unreleased-marker plugin's own subject (#1232). The
      # artifact clauses in the check above go vacuous whenever
      # the corpus carries no marker, which is most of the time —
      # scripts/unreleased-strip retires them all at each release
      # — so this is what actually holds the plugin's behavior.
      - name: Check the unreleased-docs marker
        run: |
          set -euo pipefail
          node test-unreleased.mjs
          # And the CORPUS, at PR time. The release-time sweep is
          # fail-fast, and it sits in the workflow that carries
          # the appcast — so a malformed `:::` reaching `main`
          # would block the update feed on a docs typo. Validating
          # here is what lets that sweep stay fail-fast: `docs/**`
          # is a path input of this workflow and is not on
          # `.github/ci-ignore.txt`, so no docs change reaches
          # `main` without passing this.
          python3 ../scripts/unreleased-strip --check
