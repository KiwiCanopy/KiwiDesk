# Cloudflare Pages configuration for the KiwiDesk site (#106).
#
# One-time dashboard setup (Pages ▸ Create ▸ Connect to Git ▸ this
# repo). The project name must be `kiwidesk` so the default domain
# matches astro.config.mjs's fallback:
#   Root directory:       site
#   Build command:        npm run build
#   Build output dir:     dist   <- relative to Root directory, so
#                                  NOT "site/dist"
#
# Every push to the production branch auto-deploys; other branches
# get preview URLs. The repo stays PRIVATE — Pages builds a private
# repo over the GitHub App, so publishing never requires opening
# the source.
#
# NODE VERSION: pinned by site/.nvmrc, the one copy of that number
# (Cloudflare reads it, as do CI and a local `nvm use`). Do NOT add
# a `.node-version` beside it — Cloudflare resolves that file first,
# so a duplicate wins the deploy while every local and CI signal
# keeps reading `.nvmrc`. The argument is in
# .claude/rules/site.md ("Never add a second Node pin file").
#
# DASHBOARD ENV VARS DO NOT REACH BUILDS. With this file committed,
# Pages sources project config from it and ignores variables added
# in the dashboard — a SITE_URL set there never arrived (observed
# on the KiwiCanopy launch, 2026-07-29). So the canonical URL is
# committed as the default in astro.config.mjs instead, and
# SITE_URL stays a local override for one-off builds only.
name = "kiwidesk"
pages_build_output_dir = "dist"
